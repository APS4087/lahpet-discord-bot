<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Lahpet</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --success-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --dark-bg: #0a0a0a;
            --darker-bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-hover-bg: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-light: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .gradient-text {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Header */
        .header {
            background: var(--darker-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        /* Main Content */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .dashboard-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .tab {
            padding: 0.75rem 1.5rem;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .tab.active {
            background: var(--primary-gradient);
            border-color: transparent;
            color: white;
        }

        .tab:hover:not(.active) {
            border-color: rgba(255, 255, 255, 0.3);
            color: var(--text-primary);
        }

        /* Content Sections */
        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        /* Genre/Mood Filters */
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-select {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .filter-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
        }

        /* Grid Layouts */
        .grid {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .movies-grid {
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }

        .music-grid {
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }

        /* Movie Cards */
        .movie-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-color);
            cursor: pointer;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-10px);
            background: var(--card-hover-bg);
            box-shadow: var(--shadow-heavy);
        }

        .movie-poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background: var(--darker-bg);
        }

        .movie-info {
            padding: 1rem;
        }

        .movie-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .movie-rating {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            color: #ffd700;
        }

        .movie-overview {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Music Cards */
        .music-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .music-card:hover {
            transform: translateY(-5px);
            background: var(--card-hover-bg);
            box-shadow: var(--shadow-light);
        }

        .music-artwork {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            background: var(--darker-bg);
            flex-shrink: 0;
        }

        .music-info {
            flex: 1;
            min-width: 0;
        }

        .music-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-artist {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-album {
            color: var(--text-muted);
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-actions {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .action-btn {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-light);
        }

        /* Loading States */
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        .loading {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty States */
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 1rem;
            }

            .main-content {
                padding: 1rem;
            }

            .dashboard-header h1 {
                font-size: 2rem;
            }

            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .music-grid {
                grid-template-columns: 1fr;
            }

            .music-card {
                flex-direction: column;
                text-align: center;
            }

            .music-artwork {
                width: 80px;
                height: 80px;
            }
        }

        /* Error States */
        .error-message {
            background: rgba(245, 87, 108, 0.1);
            border: 1px solid rgba(245, 87, 108, 0.3);
            border-radius: 10px;
            padding: 1rem;
            margin: 1rem 0;
            color: #f5576c;
            text-align: center;
        }

        /* Success States */
        .success-message {
            background: rgba(56, 239, 125, 0.1);
            border: 1px solid rgba(56, 239, 125, 0.3);
            border-radius: 10px;
            padding: 1rem;
            margin: 1rem 0;
            color: #38ef7d;
            text-align: center;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo gradient-text">Lahpet</a>
            <div class="user-info">
                <span id="username">Loading...</span>
                <div class="user-avatar" id="userAvatar">?</div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="dashboard-header">
            <h1 class="gradient-text">Your Personal Dashboard</h1>
            <p>Discover amazing movies and music tailored just for you</p>
        </div>

        <div class="filter-tabs">
            <button class="tab active" data-tab="movies">🎬 Movies</button>
            <button class="tab" data-tab="music">🎵 Music</button>
        </div>

        <!-- Movies Section -->
        <div id="movies" class="content-section active">
            <div class="filters">
                <select id="movieGenre" class="filter-select">
                    <option value="">All Genres</option>
                    <option value="action">Action</option>
                    <option value="comedy">Comedy</option>
                    <option value="drama">Drama</option>
                    <option value="horror">Horror</option>
                    <option value="romance">Romance</option>
                    <option value="science_fiction">Sci-Fi</option>
                    <option value="thriller">Thriller</option>
                    <option value="animation">Animation</option>
                </select>
                
                <select id="movieMood" class="filter-select">
                    <option value="">Any Mood</option>
                    <option value="feel_good">Feel Good</option>
                    <option value="intense">Intense</option>
                    <option value="relaxing">Relaxing</option>
                    <option value="mind_bending">Mind-bending</option>
                    <option value="nostalgic">Nostalgic</option>
                </select>
            </div>

            <div id="moviesGrid" class="grid movies-grid">
                <div class="loading-container">
                    <div class="loading"></div>
                </div>
            </div>
        </div>

        <!-- Music Section -->
        <div id="music" class="content-section">
            <div class="filters">
                <select id="musicGenre" class="filter-select">
                    <option value="">All Genres</option>
                    <option value="pop">Pop</option>
                    <option value="rock">Rock</option>
                    <option value="hip-hop">Hip-Hop</option>
                    <option value="electronic">Electronic</option>
                    <option value="jazz">Jazz</option>
                    <option value="classical">Classical</option>
                    <option value="rnb">R&B</option>
                    <option value="indie">Indie</option>
                </select>
                
                <select id="musicMood" class="filter-select">
                    <option value="">Any Vibe</option>
                    <option value="energetic">Energetic</option>
                    <option value="chill">Chill</option>
                    <option value="melancholic">Melancholic</option>
                    <option value="upbeat">Upbeat</option>
                    <option value="focus">Focus</option>
                </select>
            </div>

            <div id="musicGrid" class="grid music-grid">
                <div class="loading-container">
                    <div class="loading"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Get user info from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user') || 'user';
        const username = urlParams.get('username') || 'User';

        // Update user display
        document.getElementById('username').textContent = username;
        document.getElementById('userAvatar').textContent = username.charAt(0).toUpperCase();

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove active class from all tabs and sections
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
                
                // Add active class to clicked tab and corresponding section
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
                
                // Load content if not already loaded
                if (tab.dataset.tab === 'movies' && !window.moviesLoaded) {
                    loadMovies();
                } else if (tab.dataset.tab === 'music' && !window.musicLoaded) {
                    loadMusic();
                }
            });
        });

        // Filter change handlers
        document.getElementById('movieGenre').addEventListener('change', loadMovies);
        document.getElementById('movieMood').addEventListener('change', loadMovies);
        document.getElementById('musicGenre').addEventListener('change', loadMusic);
        document.getElementById('musicMood').addEventListener('change', loadMusic);

        // Load movies
        async function loadMovies() {
            const grid = document.getElementById('moviesGrid');
            const genre = document.getElementById('movieGenre').value;
            const mood = document.getElementById('movieMood').value;
            
            grid.innerHTML = '<div class="loading-container"><div class="loading"></div></div>';
            
            try {
                const params = new URLSearchParams();
                if (genre) params.append('genre', genre);
                if (mood) params.append('mood', mood);
                
                const response = await fetch(`/api/movies?${params}`);
                const data = await response.json();
                
                if (data.success && data.data.length > 0) {
                    grid.innerHTML = data.data.map(movie => createMovieCard(movie)).join('');
                    window.moviesLoaded = true;
                } else {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-film empty-icon"></i>
                            <h3>No movies found</h3>
                            <p>Try adjusting your filters or check back later.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading movies:', error);
                grid.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        Failed to load movies. Please try again later.
                    </div>
                `;
            }
        }

        // Load music
        async function loadMusic() {
            const grid = document.getElementById('musicGrid');
            const genre = document.getElementById('musicGenre').value;
            const mood = document.getElementById('musicMood').value;
            
            grid.innerHTML = '<div class="loading-container"><div class="loading"></div></div>';
            
            try {
                const params = new URLSearchParams();
                if (genre) params.append('genre', genre);
                if (mood) params.append('mood', mood);
                params.append('limit', '20');
                
                const response = await fetch(`/api/music?${params}`);
                const data = await response.json();
                
                if (data.success && data.data.length > 0) {
                    grid.innerHTML = data.data.map(track => createMusicCard(track)).join('');
                    window.musicLoaded = true;
                } else {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-music empty-icon"></i>
                            <h3>No music found</h3>
                            <p>Try adjusting your filters or check back later.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading music:', error);
                grid.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        Failed to load music. Please try again later.
                    </div>
                `;
            }
        }

        // Create movie card
        function createMovieCard(movie) {
            const posterUrl = movie.poster_path 
                ? `https://image.tmdb.org/t/p/w500${movie.poster_path}`
                : 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMzMzIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNiIgZmlsbD0iIzY2NiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPk5vIEltYWdlPC90ZXh0Pjwvc3ZnPg==';
            
            return `
                <div class="movie-card" onclick="openMovieDetails('${movie.id || Math.random()}')">
                    <img src="${posterUrl}" alt="${movie.title}" class="movie-poster" 
                         onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMzMzIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNiIgZmlsbD0iIzY2NiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPk5vIEltYWdlPC90ZXh0Pjwvc3ZnPg=='">
                    <div class="movie-info">
                        <h3 class="movie-title">${movie.title}</h3>
                        <div class="movie-meta">
                            <span>${movie.release_date ? new Date(movie.release_date).getFullYear() : 'N/A'}</span>
                            <div class="movie-rating">
                                <i class="fas fa-star"></i>
                                <span>${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}</span>
                            </div>
                        </div>
                        <p class="movie-overview">${movie.overview || 'No description available.'}</p>
                    </div>
                </div>
            `;
        }

        // Create music card
        function createMusicCard(track) {
            const artworkUrl = track.album?.images?.[0]?.url || 
                'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iIzMzMyIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTAiIGZpbGw9IiM2NjYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj7wn461PC90ZXh0Pjwvc3ZnPg==';
            
            const duration = track.duration_ms ? 
                `${Math.floor(track.duration_ms / 60000)}:${String(Math.floor((track.duration_ms % 60000) / 1000)).padStart(2, '0')}` : 'N/A';
            
            return `
                <div class="music-card">
                    <img src="${artworkUrl}" alt="${track.name}" class="music-artwork" 
                         onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iIzMzMyIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTAiIGZpbGw9IiM2NjYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj7wn461PC90ZXh0Pjwvc3ZnPg=='">
                    <div class="music-info">
                        <h3 class="music-title">${track.name}</h3>
                        <p class="music-artist">${track.artists?.[0]?.name || 'Unknown Artist'}</p>
                        <p class="music-album">${track.album?.name || 'Unknown Album'} • ${duration}</p>
                    </div>
                    <div class="music-actions">
                        ${track.external_urls?.spotify ? 
                            `<button class="action-btn" onclick="window.open('${track.external_urls.spotify}', '_blank')" title="Open in Spotify">
                                <i class="fab fa-spotify"></i>
                            </button>` : ''
                        }
                        <button class="action-btn" onclick="shareTrack('${track.name}', '${track.artists?.[0]?.name || 'Unknown'}')" title="Share">
                            <i class="fas fa-share"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // Share track function
        function shareTrack(trackName, artistName) {
            if (navigator.share) {
                navigator.share({
                    title: `${trackName} by ${artistName}`,
                    text: `Check out this song: ${trackName} by ${artistName}`,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(`${trackName} by ${artistName}`);
                showToast('Track info copied to clipboard!');
            }
        }

        // Movie details function (placeholder)
        function openMovieDetails(movieId) {
            showToast('Movie details coming soon!');
        }

        // Toast notification
        function showToast(message) {
            // Simple toast implementation
            const toast = document.createElement('div');
            toast.className = 'success-message';
            toast.textContent = message;
            toast.style.position = 'fixed';
            toast.style.top = '20px';
            toast.style.right = '20px';
            toast.style.zIndex = '1000';
            toast.style.minWidth = '200px';
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Initialize with movies
        loadMovies();
    </script>
</body>
</html>
